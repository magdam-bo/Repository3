<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11141b"><title>鳥籠の聖堂（仮）</title><link rel="stylesheet" href="style.css?v=3"></head>
<body><main class="shell"><header><strong>鳥籠の聖堂 <small>PROTOTYPE</small></strong><span id="room-name">大聖堂</span></header><section id="stage"><div id="game"></div><div class="shade"></div><div id="toast" class="toast">矢印キー / WASD で移動</div><div id="dialog" class="dialog hidden"><b id="speaker"></b><p id="line"></p><span>決定：Z / Enter</span></div><div id="title" class="overlay"><article><div class="sigil">✦</div><h1>鳥籠の聖堂</h1><p>目を覚ますと、古い教会の床に倒れていた。<br>鎖の音が、すぐそばから聞こえる。</p><p id="load-status" role="status">素材を読み込み中…</p><button id="start" disabled>読み込み中…</button><button id="continue" class="secondary" disabled>つづきから</button><p class="controls">移動：矢印 / WASD　調べる：Z / Enter　持ち物：I　メニュー：Esc</p></article></div><div id="modal" class="overlay hidden"><article><h2 id="modal-title"></h2><div id="modal-content"></div><div class="buttons"><button id="save">セーブ</button><button id="modal-close" class="secondary">閉じる</button></div></article></div><div id="pin-modal" class="overlay hidden"><article><h2>鍵付きの棚</h2><p>4桁の番号を入力して決定</p><output id="pin-display">・・・・</output><div id="pin-pad"></div><button id="pin-cancel" class="secondary" aria-label="暗証番号入力から戻る">戻る</button></article></div><div id="mobile-pad" class="hidden" aria-label="方向パッド"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button><button id="mobile-action">決定 / 調べる</button><button id="mobile-back">戻る</button><button id="mobile-items">持ち物</button></div></section><footer>探索型ホラー脱出ゲーム　／　操作できる試作版</footer></main><script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script><script src="game.js?v=13"></script></body></html>
